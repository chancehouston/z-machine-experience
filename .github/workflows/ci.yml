name: CI

on:
  push:
    branches: [main]
  pull_request:

# The same story file, script and seed must give the same output on every platform
# (SC-003). Both jobs compare against the same committed reference files, so both
# passing is the evidence.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      # Everything the project requires. Needs nothing but Rust: the story files and
      # the reference transcripts are in the repository.
      - name: Test
        run: cargo test --workspace

      # The remaining tests check the committed reference files against the
      # reference interpreter itself, which must be Frotz 2.55. The tests refuse any
      # other version.
      - name: Install dfrotz 2.55 (macOS)
        if: runner.os == 'macOS'
        run: brew install frotz

      - name: Build dfrotz 2.55 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSfL -o frotz.tar.gz https://www.ifarchive.org/if-archive/infocom/interpreters/frotz/frotz-2.55.tar.gz
          mkdir frotz-src
          tar xzf frotz.tar.gz -C frotz-src --strip-components=1
          make -C frotz-src dumb
          echo "$PWD/frotz-src" >> "$GITHUB_PATH"

      - name: Check dfrotz version
        run: dfrotz -v | head -1 | grep -F "FROTZ V2.55"

      # Optimized, because one of these tests times the full walkthrough (SC-005).
      - name: Test against dfrotz, and timing
        run: cargo test --workspace --release -- --ignored

  # The iPhone app (feature 004). It needs Xcode with an iOS 26 or later
  # simulator, which a hosted runner may not have: the job finds out, and where
  # there is none it says so and does nothing more, rather than failing.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find a simulator
        id: sim
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j > devices.json
          udid=$(python3 - <<'PY'
          import json, re
          best = None
          for runtime, devices in json.load(open("devices.json"))["devices"].items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m or int(m.group(1)) < 26:
                  continue
              for d in devices:
                  if d["name"].startswith("iPhone") and d.get("isAvailable"):
                      key = (int(m.group(1)), int(m.group(2)))
                      if best is None or key > best[0]:
                          best = (key, d["udid"])
          print(best[1] if best else "")
          PY
          )
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          if [ -z "$udid" ]; then
            echo "::notice::This runner has no iPhone simulator for iOS 26 or later; the app was not built or tested here."
          fi

      - name: Install tools
        if: steps.sim.outputs.udid != ''
        run: |
          brew install xcodegen
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build the bindings and generate the project
        if: steps.sim.outputs.udid != ''
        run: scripts/build-ios.sh

      # The specification's limit for launch is two seconds (SC-001), and the test
      # holds to it on a developer's Mac. A shared runner is slower (2122 ms on the
      # first run here), so here the limit only catches a launch that has gone badly
      # wrong.
      - name: UI tests
        if: steps.sim.outputs.udid != ''
        env:
          TEST_RUNNER_LAUNCH_LIMIT_MILLIS: "6000"
        run: |
          xcodebuild test -project apps/ios/Lamplight.xcodeproj -scheme Lamplight \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
