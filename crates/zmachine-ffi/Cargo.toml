[package]
name = "zmachine-ffi"
version = "0.1.0"
description = "C bindings to the experience layer, for the phone shells."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# A static library for the apps, and an ordinary one so that the tests can call
# the same functions.
crate-type = ["staticlib", "lib"]

[dependencies]
zmachine-experience = { path = "../zmachine-experience" }
